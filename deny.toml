[advisories]
yanked = "deny"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    # webpki-roots: Mozilla's root certificates as data, used by rustls.
    "CDLA-Permissive-2.0",
]

# The workspace crates are AGPL and never published; the allow list is for dependencies.
[licenses.private]
ignore = true

[bans]
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

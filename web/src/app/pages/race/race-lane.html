@let l = lane();
<div class="head">
  <h2>{{ title() }}</h2>
  <p class="figure">{{ count(l.fetched) }}</p>
  <p class="small muted">
    {{ share() }} of {{ count(l.total) }} · {{ time() }} in requests
    @if (l.done && !l.error) {
      · Done
    }
  </p>
  <progress
    [value]="l.fetched"
    [max]="l.total || 1"
    [attr.aria-label]="title() + ' progress'"
  ></progress>
</div>
<app-error-notice [error]="l.error" />
<ol class="tracks">
  @for (t of l.tracks; track $index) {
    <li>
      @if (t.image) {
        <img [src]="t.image" alt="" width="40" height="40" loading="lazy" />
      } @else {
        <span class="cover" aria-hidden="true"></span>
      }
      <span class="text">
        <span class="name">{{ t.name }}</span>
        <span class="small muted">{{ t.artist }}</span>
      </span>
      <time class="small muted" [attr.datetime]="t.uts * 1000">{{ date(t.uts) }}</time>
    </li>
  }
</ol>

[package]
name = "lfm-conformance"
version = "0.1.0"
description = "Replays recorded Last.fm fixtures against a server and diffs the answers"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "lfm-conformance"
path = "src/main.rs"

[dependencies]
futures = "0.3.34"
reqwest = { version = "0.13.5", features = ["query", "form"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time"] }
toml = { version = "1.1.8", default-features = false, features = ["std", "parse", "serde"] }

[dev-dependencies]
axum = "0.8.9"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "time"] }

[lints]
workspace = true

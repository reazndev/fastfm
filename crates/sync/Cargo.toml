[package]
name = "lfm-sync"
version = "0.1.0"
description = "Moves a user's Last.fm data into the mirror's store: import, live sync, reconciliation"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "lfm-sync"
path = "src/bin/lfm-sync/main.rs"

[dependencies]
lfm-store = { path = "../store", version = "0.1.0" }
lfm-upstream = { path = "../upstream", version = "0.1.0" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"

[lints]
workspace = true

[package]
name = "lfm-mirror"
version = "0.1.0"
description = "HTTP server for the self-hosted Last.fm API mirror"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "lfm-mirror"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
async-trait = "0.1.92"
axum = "0.8.9"
base64 = "0.22.1"
bytes = "1.12.1"
futures-util = { version = "0.3.34", default-features = false }
hyper-util = { version = "0.1.21", features = ["server-auto", "server-graceful", "service", "tokio"] }
lfm-api = { path = "../api", version = "0.1.0" }
lfm-core = { path = "../core", version = "0.1.0" }
lfm-store = { path = "../store", version = "0.1.0" }
lfm-sync = { path = "../sync", version = "0.1.0" }
lfm-upstream = { path = "../upstream", version = "0.1.0" }
lfm-web = { path = "../web", version = "0.1.0" }
mimalloc = "0.1.52"
rust-embed = { version = "8.14.0", features = ["mime-guess"] }
sha2 = "0.11.1"
tower-http = { version = "0.6.11", features = ["timeout"] }
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", default-features = false, features = ["process", "std"] }

[dev-dependencies]
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
form_urlencoded = "1.2.2"
http-body-util = "0.1.3"
reqwest = "0.13.5"
serde_json = "1.0.154"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
zstd = "0.13.5"

[lints]
workspace = true

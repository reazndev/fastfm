[package]
name = "lfm-mirror"
version = "0.1.0"
description = "HTTP server for the self-hosted Last.fm API mirror"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "lfm-mirror"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
axum = "0.8.9"
bytes = "1.12.1"
lfm-api = { path = "../api", version = "0.1.0" }
lfm-core = { path = "../core", version = "0.1.0" }
mimalloc = "0.1.52"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
async-trait = "0.1.92"
form_urlencoded = "1.2.2"
http-body-util = "0.1.3"
tower = { version = "0.5.3", features = ["util"] }

[lints]
workspace = true

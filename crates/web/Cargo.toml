[package]
name = "lfm-web"
version = "0.1.0"
description = "JSON API for the web UI: accounts, API keys, the Last.fm link and write-through"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
argon2 = { version = "0.5.3", features = ["std"] }
async-trait = "0.1.92"
axum = "0.8.9"
chacha20poly1305 = { version = "0.10.1", features = ["std"] }
form_urlencoded = "1.2.2"
getrandom = "0.3.4"
lfm-api = { path = "../api", version = "0.1.0" }
lfm-core = { path = "../core", version = "0.1.0" }
lfm-store = { path = "../store", version = "0.1.0" }
lfm-sync = { path = "../sync", version = "0.1.0" }
lfm-upstream = { path = "../upstream", version = "0.1.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "sync", "time"] }
tracing = "0.1.44"

[dev-dependencies]
http-body-util = "0.1.3"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time"] }
tower = { version = "0.5.3", features = ["util"] }
wiremock = "0.6.5"

[lints]
workspace = true

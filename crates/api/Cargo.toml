[package]
name = "lfm-api"
version = "0.1.0"
description = "Method registry, dispatcher, auth and response cache for the Last.fm mirror"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
async-trait = "0.1.92"
bytes = "1.12.1"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
form_urlencoded = "1.2.2"
getrandom = "0.3.4"
lfm-core = { path = "../core", version = "0.1.0" }
lfm-store = { path = "../store", version = "0.1.0" }
lfm-upstream = { path = "../upstream", version = "0.1.0" }
moka = { version = "0.12.16", features = ["sync"] }
thiserror = "2.0.17"
tokio = { version = "1.54.1", features = ["rt", "sync", "time"] }
tracing = "0.1.44"
zstd = "0.13.5"

[dev-dependencies]
mimalloc = "0.1.52"
tokio = { version = "1.54.1", features = ["macros", "rt", "rt-multi-thread"] }
serde_json = "1.0.154"
wiremock = "0.6.5"

[lints]
workspace = true

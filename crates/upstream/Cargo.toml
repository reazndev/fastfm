[package]
name = "lfm-upstream"
version = "0.1.0"
description = "Rate-limited client for the Last.fm API"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
bytes = "1.10.1"
governor = "0.10.4"
reqwest = { version = "0.13.5", features = ["query", "form"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.47.1", features = ["sync", "time"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "time"] }
wiremock = "0.6.5"

[lints]
workspace = true

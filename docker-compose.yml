# Example deployment. Put the secrets in a .env file next to this one; never commit it.
services:
  lfm-mirror:
    build: .
    image: lfm-mirror
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - lfm-data:/data
    environment:
      # Last.fm API keys for imports and live sync, comma separated.
      LASTFM_API_KEYS: ${LASTFM_API_KEYS:?set LASTFM_API_KEYS}
      # Shared secret of the first key: lets users connect Last.fm and forward scrobbles.
      LASTFM_API_SECRET: ${LASTFM_API_SECRET:-}
      # Where browsers reach the server; needed behind a reverse proxy for the Last.fm callback.
      LFM_PUBLIC_URL: ${LFM_PUBLIC_URL:-}
      # Set to true when a reverse proxy sends X-Forwarded-For and X-Forwarded-Proto.
      LFM_TRUST_PROXY: ${LFM_TRUST_PROXY:-false}
      # auto, always or never. auto turns Secure cookies on when LFM_PUBLIC_URL is https.
      LFM_SECURE_COOKIES: ${LFM_SECURE_COOKIES:-auto}
      RUST_LOG: ${RUST_LOG:-info}

volumes:
  lfm-data:
